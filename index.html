<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario| Sistema Empresarial</title>
</head>
<body>
  <h1>Formulario de registro de usuario</h1>
  <p>Por favor, completa la información para crear tu cuenta corporativa.</p>
    <section>
        <form  action="#" method="post">
          <div>
            <label for="nombre">Nombre completo:</label>
          <input type="text"
                  id="nombre"
                  name="nombre" 
                  placeholder="Nombre completo" 
                  required 
                  class="input-control">
          <button type="submit">submit</button>
          </div>
        </form>
      <div>
        <br>
        <label for="email">Correo electronico corporativo:</label>
        <input
        type="email" 
        id="email" 
        name="email" 
        placeholder="usuario@empresa.com">
      </div>
      <br>
      <div>
      <label for="password">Contraseña</label>
      <input
      type="password"
      id="password"
      name="password"
      placeholder="password">
      </div>
      <br>
      <div>
        <label for="confirm_password">Confirma contraseña</label>
        <input
        type="confirm_password"
        id="confirm_password"
        name="confirm_password"
        placeholder="confirm_password">
      </div>
      <br>
      <button type="submit">Guardar y continuar</button>
      </div>
      <br><hr><br>
      <!---dia 2:informaciion oprativa y archivos-->
      <div>
        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
          <input
          type="date"
          id="fecha_nacimiento"
          name="fecha_nacimiento"
          >
      </div>
      <br><br>
      <div>
        <label for="presupuesto">Presupuesto estimado ($1,000 - $10,000):</label>
        <input
        type="rango"
        id="presupuesto"
        name="presupuesto"
        min="1000"
        max="10000"
        step="500">
      </div>
      <br>
      <div>
        <label for="color_marca"></label>
        <input 
        type="color"
        id="color_marca"
        name="color_marca"
        value="#3b82f6">
      </div>
      <br>
      <button type="submit">Enviar</button>
    </section>
</body>
</html>
