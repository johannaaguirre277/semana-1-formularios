<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Registro de usuario| Sistema Empresarial</title>
</head>
<body>
  <h1>Formulario de registro de usuario</h1>
  <p>Por favor, completa la información para crear tu cuenta corporativa.</p>

  <!-- inicio del formulario principal -->
  <form action="#" method="post">

    <!-- dia 1 y dia 4: datos de cuenta y configuracion -->
    <fieldset>
      <legend>1. Datos de cuenta</legend>

      <div>
        <label for="nombre">Nombre completo:</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required autofocus class="input-control">
      </div>
      <br>

      <div>
        <label for="email">Correo electrónico corporativo:</label><br>
        <input type="email" id="email" name="email" placeholder="usuario@empresa.com" required>
      </div>
      <br>

      <div>
        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" name="password" placeholder="Contraseña" required>
      </div>
      <br>

      <div>
        <label for="confirm_password">Confirma contraseña:</label><br>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirma contraseña" required>
      </div>
      <br>

      <!-- datalist para el dia 4 -->
      <div>
        <label for="sector">Sector industrial:</label><br>
        <input type="text" id="sector" name="sector" list="sectores-list" placeholder="Selecciona o escribe uno...">
        <datalist id="sectores-list">
          <option value="Tecnología e Informática">
          <option value="Diseño y Multimedia">
          <option value="Educación">
          <option value="Salud y Medicina">
          <option value="Finanzas y Comercio">
        </datalist>
      </div>
    </fieldset>

    <br>

    <!-- dia 2 y dia 4: informacion operativa y archivos -->
    <fieldset>
      <legend>2. Información operativa y archivos</legend>

      <div>
        <label for="fecha_nacimiento">Fecha de nacimiento:</label><br>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
      </div>
      <br>

      <div>
        <label for="presupuesto">Presupuesto estimado ($1,000 - $10,000):</label><br>
        <input type="range" id="presupuesto" name="presupuesto" min="1000" max="10000" step="500">
      </div>
      <br>

      <div>
        <label for="color_marca">Color de marca:</label><br>
        <input type="color" id="color_marca" name="color_marca" value="#3b82f6">
      </div>
      <br>

      <!-- campo de solo lectura para el dia 4 -->
      <div>
        <label for="codigo-ref">Código de referido:</label><br>
        <input type="text" id="codigo-ref" name="codigo-ref" value="REF-2026-X99" readonly>
      </div>
    </fieldset>

    <br>

    <!-- dia 3: seleccion de plan, preferencias y terminos -->
    <fieldset>
      <legend>3. Selección de plan, preferencias y términos</legend>

      <p>Selección de plan:</p>
      <input type="radio" id="plan-basico" name="plan" value="basico" checked>
      <label for="plan-basico">Básico</label>
      <br>

      <input type="radio" id="plan-pro" name="plan" value="pro">
      <label for="plan-pro">Pro</label>
      <br>

      <input type="radio" id="plan-enterprise" name="plan" value="enterprise">
      <label for="plan-enterprise">Enterprise</label>
      <br><br>

      <p>Notificaciones deseadas:</p>
      <input type="checkbox" id="notif-email" name="notificaciones" value="email">
      <label for="notif-email">Email</label>
      <br>

      <input type="checkbox" id="notif-sms" name="notificaciones" value="sms">
      <label for="notif-sms">SMS</label>
      <br>

      <input type="checkbox" id="notif-whatsapp" name="notificaciones" value="whatsapp">
      <label for="notif-whatsapp">WhatsApp</label>
      <br><br>

      <label for="pais">País / Región:</label>
      <select id="pais" name="pais">
        <option value="">Selecciona tu país</option>
        <option value="co">Colombia</option>
        <option value="mx">México</option>
        <option value="es">España</option>
        <option value="ar">Argentina</option>
        <option value="ot">Otro</option>
      </select>
      <br><br>

      <label for="descripcion">Descripción o notas adicionales:</label><br>
      <textarea id="descripcion" name="descripcion" rows="4" cols="40" placeholder="Escribe aquí tus comentarios..."></textarea>
      <br><br>

      <input type="checkbox" id="terminos" name="terminos" required>
      <label for="terminos">Acepto Términos y Condiciones</label>
    </fieldset>

    <br>

    <!-- botones finales de envio -->
    <button type="submit">Enviar Registro</button>
    <button type="reset">Limpiar Formulario</button>

  </form>
</body>
</html>
